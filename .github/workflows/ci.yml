name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/buddy.js

      - name: Content, links and privacy
        run: python3 scripts/check.py
